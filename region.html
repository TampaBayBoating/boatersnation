<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#071826;color:#e8eef4;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
  .topbar{background:#0a2540;padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:3px solid #B31942}
  .topbar a{display:flex;align-items:center;gap:10px;color:#e8eef4;text-decoration:none}
  .anchor{width:38px;height:38px;border-radius:50%;object-fit:cover;display:block}
  .topbar b{font-size:1.05rem;letter-spacing:.2px}
  .topbar span{color:#E63946;font-weight:800}
  .wrap{max-width:760px;margin:0 auto;padding:18px 14px 30px}
  .back{color:#9db4c6;font-size:.88rem;text-decoration:none;font-weight:700}
  .kicker{color:#E63946;font-weight:800;font-size:.75rem;letter-spacing:2px;text-transform:uppercase;margin-top:12px}
  h1{font-size:1.65rem;line-height:1.15;margin:6px 0 8px}
  .intro{color:#c9d8e4;font-size:.98rem;margin-bottom:14px}
  h2{font-size:1.2rem;margin:20px 0 8px}
  .chip{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:999px}
  .chip.live{background:#14532d;color:#4ade80}
  .chip.building{background:#123c5e;color:#9db4c6}
  .feats{display:grid;grid-template-columns:1fr;gap:8px}
  .feat{display:block;background:#eef5fb;color:#0a2540;border-radius:14px;padding:12px 14px;text-decoration:none}
  .feat h3{font-size:1rem;margin-bottom:2px}
  .feat p{font-size:.88rem;color:#33536e;line-height:1.35}
  .feat .go{color:#0072B2;font-weight:800;font-size:.85rem}
  .featdiv{background:#0a2540;border:1px solid #123c5e;border-radius:14px;padding:12px 14px}
  .featdiv h3{font-size:1rem;margin-bottom:2px;color:#fff}
  .featdiv p{font-size:.88rem;color:#9db4c6;line-height:1.35}
  .note{background:#0a2540;border:1px solid #123c5e;border-radius:14px;padding:13px 15px;color:#c9d8e4;font-size:.9rem;margin-bottom:12px}
  .note b{color:#fff}
  .btn{display:inline-block;margin-top:10px;padding:10px 18px;border-radius:999px;background:#B31942;color:#ffffff;font-weight:800;font-size:.9rem;text-decoration:none}
  .wl{margin-top:12px;display:grid;gap:8px;text-align:left}
  .wl label{font-size:.8rem;font-weight:700;color:#c9d8e4}
  .wl input{display:block;width:100%;margin-top:3px;padding:11px 12px;border-radius:10px;border:1.5px solid #123c5e;background:#071826;color:#fff;font-size:1rem;font-family:inherit}
  .wl button{padding:12px;border-radius:999px;border:none;background:#B31942;color:#ffffff;font-weight:800;font-size:.95rem;cursor:pointer;font-family:inherit}
  .fine{text-align:center;color:#7d97ab;font-size:.8rem;margin-top:18px}
  .fine b{color:#c9d8e4}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 12px}
.tab{flex:1 1 30%;padding:10px 6px;border-radius:999px;border:1.5px solid rgba(232,238,244,.35);background:transparent;color:#e8eef4;font-weight:800;font-size:.85rem;cursor:pointer;font-family:inherit}
.tab.on{background:#B31942;color:#ffffff;border-color:#E63946}
.panel{display:none}
.panel.on{display:block}
  @media(min-width:560px){.feats{grid-template-columns:1fr 1fr}}

.bn-header{position:relative;background:#0a2540}
.tb-lang{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;font-size:.95rem;padding:7px 10px;cursor:pointer;line-height:1;margin-left:auto;font-family:inherit;font-weight:700;white-space:nowrap}
.tb-lang:hover{background:rgba(255,255,255,.25)}
.tb-translate{display:none;position:absolute;top:56px;right:12px;background:#fff;border-radius:10px;padding:8px 10px;box-shadow:0 10px 32px rgba(0,0,0,.3);z-index:1000}
.tb-translate.open{display:block}
.tb-translate .goog-te-gadget{font-size:.85rem}
.tb-gadget-hidden{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden}
.lang-list{min-width:216px;max-height:46vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#e7aebd transparent}
.lang-list::-webkit-scrollbar{width:8px}
.lang-list::-webkit-scrollbar-thumb{background:#e7aebd;border-radius:8px}
.lang-list::-webkit-scrollbar-track{background:transparent}
.lang-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;background:#fff;border-radius:8px;font-size:.95rem;color:#0b3d62;cursor:pointer;text-align:left;font-family:inherit}
.lang-row:hover{background:#fdf0f2}
.lang-row .flag{font-size:1.15rem;line-height:1}
.lang-row .check{margin-left:auto;color:#B31942;font-weight:700;visibility:hidden}
.lang-row.active{background:#fdf0f2;font-weight:600}
.lang-row.active .check{visibility:visible}
.lang-search{padding:2px 0 8px}
.lang-search input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #e7aebd;border-radius:8px;font-size:.95rem;font-family:inherit;color:#0b3d62;background:#fff}
.lang-search input:focus{outline:2px solid #B31942;border-color:#B31942}
.goog-te-banner-frame{display:none !important}
iframe.goog-te-banner-frame{display:none !important}
.goog-te-banner-frame.skiptranslate{display:none !important}
body{top:0 !important}
.bn-wxbar{background:#e8f1f8;color:#0a2540;margin:8px 10px 0;padding:5px 10px;border-radius:99px;box-shadow:0 1px 6px rgba(0,0,0,.22);display:flex;align-items:center;gap:7px;flex-wrap:nowrap;overflow:hidden}
#bnWxPlace{font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.bn-s{display:flex;align-items:center;gap:3px;flex:0 0 auto}
.bn-s .bn-ic{font-size:.8rem;line-height:1}
.bn-s b{font-size:.84rem;font-weight:800;color:#0b3d62;white-space:nowrap}
.bn-score-track{position:relative;width:48px;height:8px;flex:0 0 auto;background:linear-gradient(90deg,#2fa84f 0%,#8fce62 30%,#f2d13c 55%,#f2a33c 78%,#e33f2f 100%);border-radius:99px}
.bn-score-dot{position:absolute;top:50%;left:0%;width:11px;height:11px;border-radius:50%;background:#0a2540;border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.5)}
#bnWxScorePct{font-size:.84rem;color:#0a2540;flex:0 0 auto}
.bn-wx-btn{background:#B31942;color:#fff;border:0;border-radius:999px;padding:3px 8px;font-family:inherit;font-size:.72rem;font-weight:800;cursor:pointer;flex:0 0 auto;line-height:1.2}
.bn-wx-btn:hover{background:#E63946}
@media(max-width:640px){.topbar b{font-size:.96rem}.tb-lang{font-size:.82rem;padding:6px 8px}.tb-translate{left:8px;right:8px}.lang-list{min-width:0}.bn-wxbar{margin:6px 8px 0;padding:4px 8px;gap:5px}.bn-s b{font-size:.78rem}#bnWxPlace{font-size:.68rem}}

(function(){

  if (!r) {

      + '<p class="intro">Head back to the homepage and pick your waters — or type your ZIP code and we\'ll route you.</p>'

      + '<h2>Your Tampa Bay toolkit</h2><div class="tabs">' + tabs + '</div>' + cards
      + '<a class="btn" href="https://tampabayboating.com">Open TampaBayBoating.com →</a>';
  } else {
    var ctabs = '', coming = '';

      ctabs += '<button type="button" class="tab' + (i === 0 ? ' on' : '') + '" onclick="bnTabR(\'' + id + '\',this)">' + f.name + '</button>';

      + 'and the regions with the most boaters waiting open first.</div>'
      + '<h2>What\'s coming</h2><div class="tabs">' + ctabs + '</div>' + coming

<script>
/* Boaters Nation local weather: follows the visitor's own device location. */
(function(){
  function $(id){ return document.getElementById(id); }
  function set(id, txt){ var el = $(id); if (el) el.textContent = txt; }
  function compass(deg){
    if (deg == null || isNaN(deg)) return '';
    var dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    return dirs[Math.round(deg / 22.5) % 16] + ' ';
  }
  function codeLabel(c){
    var m = {0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Light showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
    return m[c] || 'Weather';
  }
  function savePos(lat, lon){
    try { localStorage.setItem('bnWxPos', JSON.stringify({lat:lat, lon:lon, t:Date.now()})); } catch(e){}
  }
  function readPos(){
    try { var p = JSON.parse(localStorage.getItem('bnWxPos') || 'null'); return (p && isFinite(p.lat) && isFinite(p.lon)) ? p : null; } catch(e){ return null; }
  }
  function placeName(lat, lon){
    fetch('https://api.weather.gov/points/' + lat.toFixed(4) + ',' + lon.toFixed(4))
      .then(function(r){ if (!r.ok) throw new Error('nws'); return r.json(); })
      .then(function(d){
        var p = d && d.properties && d.properties.relativeLocation && d.properties.relativeLocation.properties;
        if (p && p.city) set('bnWxPlace', '📍 ' + p.city + (p.state ? ', ' + p.state : ''));
        else throw new Error('nocity');
      })
      .catch(function(){
        fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=en')
          .then(function(r){ return r.json(); })
          .then(function(d){
            var city = d.city || d.locality || '';
            var st = (d.principalSubdivisionCode || '').split('-').pop() || '';
            if (city) set('bnWxPlace', '📍 ' + city + (st ? ', ' + st : ''));
          }).catch(function(){});
      });
  }

  function bnStations(cb){
    try { var raw = localStorage.getItem('bnNoaaSt'); if (raw) { var o = JSON.parse(raw); if (o && (Date.now() - o.t) < 86400000) return cb(o.sts); } } catch(e){}
    fetch('https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json?type=waterlevels')
      .then(function(r){ return r.json(); })
      .then(function(d){ var sts = (d.stations || []).map(function(s){ return {id: s.id, lat: s.lat, lng: s.lng}; }); try { localStorage.setItem('bnNoaaSt', JSON.stringify({t: Date.now(), sts: sts})); } catch(e){} cb(sts); })
      .catch(function(){ cb(null); });
  }
  function bnTide(lat, lon, gust){
    var done = false;
    function gustFallback(){ if (done) return; done = true; set('bnWxTideLbl', 'GUST'); var ic = $('bnWxTideIc'); if (ic) ic.textContent = '💨'; set('bnWxTide', gust != null ? '' + Math.round(gust) : '--'); }
    bnStations(function(sts){
      if (!sts) return gustFallback();
      var best = null, bd = 1e18;
      sts.forEach(function(s){ var dx = (s.lat - lat) * 69, dy = (s.lng - lon) * 69 * Math.cos(lat * Math.PI / 180); var dd = dx * dx + dy * dy; if (dd < bd) { bd = dd; best = s; } });
      if (!best || bd > 15625) return gustFallback();
      fetch('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?date=today&station=' + best.id + '&product=water_level&datum=MLLW&time_zone=lst_ldt&units=english&format=json')
        .then(function(r){ return r.json(); })
        .then(function(d){
          var a = (d && d.data) || [];
          if (a.length < 8) return gustFallback();
          var last = parseFloat(a[a.length - 1].v), prev = parseFloat(a[a.length - 8].v);
          if (isNaN(last) || isNaN(prev)) return gustFallback();
          done = true;
          var diff = last - prev;
          set('bnWxTide', diff > 0.03 ? 'Rising' : diff < -0.03 ? 'Falling' : 'Slack');
          var ic = $('bnWxTideIc'); if (ic) ic.textContent = diff > 0.03 ? '⬆️' : diff < -0.03 ? '⬇️' : '➡️';
        })
        .catch(gustFallback);
    });
  }
  function loadWeather(lat, lon){
    placeName(lat, lon);
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + encodeURIComponent(lat) + '&longitude=' + encodeURIComponent(lon)
      + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m'
      + '&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=1&hourly=precipitation_probability';
    fetch(url)
      .then(function(r){ if (!r.ok) throw new Error('wx'); return r.json(); })
      .then(function(d){
        var c = d.current || {};
        if (c.temperature_2m != null) set('bnWxAir', Math.round(c.temperature_2m) + '°');
        if (c.apparent_temperature != null) set('bnWxFeels', Math.round(c.apparent_temperature) + '°');
        if (c.wind_speed_10m != null) set('bnWxWind', compass(c.wind_direction_10m) + Math.round(c.wind_speed_10m));
        if (c.wind_gusts_10m != null) set('bnWxGust', Math.round(c.wind_gusts_10m));
        if (c.relative_humidity_2m != null) set('bnWxHum', Math.round(c.relative_humidity_2m) + '%');
        var pp = null;
        if (d.hourly && d.hourly.time && d.hourly.precipitation_probability) {
          var hi = d.hourly.time.indexOf((c.time || '').slice(0, 13) + ':00');
          if (hi < 0) hi = 0;
          pp = d.hourly.precipitation_probability[hi];
        }
        var score = 100;
        var w = c.wind_speed_10m || 0, g = c.wind_gusts_10m || 0;
        score -= Math.max(0, w - 5) * 2.2;
        score -= Math.max(0, g - 15) * 1.2;
        if (pp != null) score -= pp * 0.35;
        var wc = c.weather_code;
        if (wc >= 95) score -= 55; else if (wc >= 80) score -= 30; else if (wc >= 61) score -= 22; else if (wc >= 51) score -= 10; else if (wc === 45 || wc === 48) score -= 15;
        function bnSetScore(s){ s = Math.max(5, Math.min(100, Math.round(s))); set('bnWxScorePct', s + '%'); var dot = $('bnWxScoreDot'); if (dot) dot.style.left = (100 - s) + '%'; }
        bnSetScore(score);
        set('bnWxCond', codeLabel(c.weather_code));
        fetch('https://marine-api.open-meteo.com/v1/marine?latitude=' + lat + '&longitude=' + lon + '&current=wave_height,sea_surface_temperature&temperature_unit=fahrenheit&forecast_days=1')
          .then(function(r){ return r.json(); })
          .then(function(m){
            var sst = m && m.current && m.current.sea_surface_temperature;
            if (sst != null) set('bnWxWater', Math.round(sst) + '°');
            else if (c.apparent_temperature != null) { set('bnWxWater', Math.round(c.apparent_temperature) + '°'); set('bnWxWaterLbl', 'FEELS'); }
            var wh = m && m.current && m.current.wave_height; if (wh == null) return;
            var ft = wh * 3.281; var wd = ft <= 1 ? 0 : ft <= 2 ? 8 : ft <= 3 ? 18 : ft <= 4 ? 30 : 45; bnSetScore(score - wd);
          })
          .catch(function(){ if (c.apparent_temperature != null) { set('bnWxWater', Math.round(c.apparent_temperature) + '°'); set('bnWxWaterLbl', 'FEELS'); } });
        bnTide(lat, lon, c.wind_gusts_10m);
        if (c.time) {
          var dt = new Date(c.time);
          if (!isNaN(dt)) set('bnWxUpdated', 'Updated ' + dt.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}));
        }
        var b = $('bnWxBtn'); if (b) b.textContent = '↻';
      })
      .catch(function(){ set('bnWxCond', 'Weather unavailable right now'); });
  }
  function locate(){
    if (!navigator.geolocation) {
      set('bnWxPlace', '📍 Location unavailable');
      set('bnWxCond', 'Use the ZIP finder for your waters');
      return;
    }
    set('bnWxPlace', '📍 Locating…');
    navigator.geolocation.getCurrentPosition(function(pos){
      savePos(pos.coords.latitude, pos.coords.longitude);
      loadWeather(pos.coords.latitude, pos.coords.longitude);
    }, function(){
      set('bnWxPlace', '📍 Location off');
      set('bnWxUpdated', 'Weather follows your device');
      set('bnWxCond', 'Allow location, then tap Use my location');
    }, {enableHighAccuracy:false, timeout:10000, maximumAge:600000});
  }
  var btn = $('bnWxBtn');
  if (btn) btn.addEventListener('click', locate);
  var saved = readPos();
  if (saved && (Date.now() - (saved.t || 0)) < 1800000) loadWeather(saved.lat, saved.lon);
  else locate();
  setInterval(function(){ var p = readPos(); if (p) loadWeather(p.lat, p.lon); }, 900000);
})();
</script>
<script>
function googleTranslateElementInit(){ new google.translate.TranslateElement({pageLanguage:'en',layout:google.translate.TranslateElement.InlineLayout.SIMPLE,autoDisplay:false},'google_translate_element'); }
document.getElementById('lang-btn').addEventListener('click',function(e){ e.stopPropagation(); document.getElementById('translate-panel').classList.toggle('open'); });
document.addEventListener('click',function(e){ var p=document.getElementById('translate-panel'); if(p&&p.classList.contains('open')&&!e.target.closest('#translate-panel')&&!e.target.closest('#lang-btn')) p.classList.remove('open'); });
(function(){
  function gtSet(code){
    var host=location.hostname, dom=null;
    if(host && host.indexOf('.')>0 && host!=='localhost' && !/^\d+\.\d+\.\d+\.\d+$/.test(host)){ var parts=host.split('.'); dom='.'+parts.slice(-2).join('.'); }
    function write(val,exp){
      var base='googtrans='+val+'; path=/' + (exp?'; expires='+exp:'');
      document.cookie=base;
      if(dom) document.cookie=base+'; domain='+dom;
    }
    if(code==='en'){ write('', 'Thu, 01 Jan 1970 00:00:00 GMT'); write('/en/en'); }
    else { write('/en/'+code); }
  }
  var rows=document.querySelectorAll('#translate-panel .lang-row');
  var m=document.cookie.match(/googtrans=\/en\/([a-zA-Z-]+)/);
  var cur=m?m[1]:'en';
  rows.forEach(function(r){ r.classList.toggle('active', r.getAttribute('data-lang')===cur); });
  rows.forEach(function(r){ r.addEventListener('click',function(){ gtSet(r.getAttribute('data-lang')); location.reload(); }); });
})();
</script>
<script>

  function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  var q = document.getElementById('lang-q'); if(!q) return;
  var rows = Array.prototype.slice.call(document.querySelectorAll('#translate-panel .lang-row'));
  var none = document.getElementById('lang-none');
  q.addEventListener('click', function(e){ e.stopPropagation(); });
  q.addEventListener('input', function(){
    var t = norm(q.value.trim()), shown = 0;
    rows.forEach(function(r){
      var code = r.getAttribute('data-lang');
      var hit = !t || norm(r.textContent).indexOf(t) >= 0 || norm(EN[code]||'').indexOf(t) >= 0 || code.toLowerCase() === t;
      r.style.display = hit ? '' : 'none'; if(hit) shown++;
    });
    if(none) none.style.display = shown ? 'none' : '';
  });
})();
</script>

<script>
/* Keep Google Translate's top banner hidden: GT re-injects it on every
   translation, so watch for it and hide it each time it appears. */
(function(){
  function hideEl(f){ f.style.setProperty('display','none','important'); f.style.setProperty('visibility','hidden','important'); }
  function killBar(){
    document.querySelectorAll('.goog-te-banner-frame').forEach(hideEl);
    var tt=document.getElementById('goog-gt-tt'); if(tt) tt.style.setProperty('display','none','important');
    document.querySelectorAll('iframe').forEach(function(f){
      try{
        var src=f.getAttribute('src')||'';
        if(src.indexOf('translate')>-1){ hideEl(f); return; }
        var r=f.getBoundingClientRect(), cs=getComputedStyle(f);
        if((cs.position==='fixed'||cs.position==='absolute') && r.top<=2 && r.height>=20 && r.height<=180 && r.width>=window.innerWidth*0.9) hideEl(f);
      }catch(e){}
    });
    if(document.body) document.body.style.setProperty('top','0px','important');
  }
  new MutationObserver(killBar).observe(document.documentElement,{childList:true,subtree:true});
  setInterval(killBar,2000);
  killBar();
})();
</script>
